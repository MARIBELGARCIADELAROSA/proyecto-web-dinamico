<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Punto de Venta - Gestión de Inventario</h1>

    <div class="container">
        <form id="producto-form">
            <h2>Registrar Producto</h2>
            <input type="hidden" id="producto-id">
            
            <div>
                <label for="nombre_producto">Nombre del Producto:</label>
                <input type="text" id="nombre_producto" required>
            </div>
            
            <div>
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion">
            </div>
            
            <div class="columnas-dos">
                <div>
                    <label for="precio_venta">Precio Venta:</label>
                    <input type="number" id="precio_venta" step="0.01" required>
                </div>
                <div>
                    <label for="precio_costo">Precio Costo:</label>
                    <input type="number" id="precio_costo" step="0.01">
                </div>
            </div>

            <div class="columnas-dos">
                <div>
                    <label for="stock">Stock (Inventario):</label>
                    <input type="number" id="stock" required>
                </div>
                <div>
                    <label for="sku">SKU (Código):</label>
                    <input type="text" id="sku">
                </div>
            </div>
            
            <div>
                <label for="categoria">Categoría:</label>
                <input type="text" id="categoria">
            </div>

            <button type="submit" id="btn-guardar">Guardar Producto</button>
            <button type="button" id="btn-cancelar" class="btn-cancelar" style="display:none;">Cancelar Edición</button>
        </form>

        <div id="productos-lista-contenedor">
            <h2>Inventario Actual</h2>
            <div id="productos-lista">
                </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
